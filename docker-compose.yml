services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hr_saas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - hr_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hr_saas"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hr_postgres_data:

